# Clang arguments for the ${PLATFORM} platform.

# Place directories in include and linker search paths, ahead of the parent's
# so this platform's headers and libraries win.
-isystem <CFGDIR>/../mos-platform/${PLATFORM}/include
# -isystem is not passed to the assembler.
-I <CFGDIR>/../mos-platform/${PLATFORM}/asminc
-L<CFGDIR>/../mos-platform/${PLATFORM}/lib

@mos-${PARENT}.cfg

# Target-specific flags last: the driver keeps the final -mlto-zp, -mcpu and
# the like, so anything set here has to come after what it overrides.
${CONFIG}
